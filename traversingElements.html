<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script defer src="traversingElements.js"></script>
  <title>DOM Manipulation : TraversingElements</title>
</head>
<body>
   <!-- parent element -->
  <ul>
    <!-- child elements -->
    <li>First</li>
    <li>Second</li>
    <li id="one">Third</li>
    <li>Fourth</li>
    <!-- all li are siblings to each other -->
  </ul>

    <ul id="two">
    <li>First</li>
    <li>Second</li>
    <li class="hi">Third</li>
    <li>Fourth</li>
  </ul>
</body>
</html>
